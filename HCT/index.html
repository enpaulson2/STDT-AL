<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STDT Action Learning</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#142f52;font:16px system-ui}header{background:#142f52;color:white;padding:24px}header small{color:#e7b54b}h1{font-size:clamp(24px,4vw,36px);margin:8px 0}main{max-width:1100px;margin:auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr 1fr}section{background:white;border-radius:12px;padding:18px;border:1px solid #dbe2eb}h2{font-size:20px}h3{font-size:16px;margin-bottom:8px}button,select,input,textarea{font:inherit}button{border:1px solid #aab9ca;background:white;color:#142f52;border-radius:8px;padding:9px;margin:3px;cursor:pointer}button[aria-pressed=true]{background:#142f52;color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #e7b54b}textarea{width:100%;padding:10px;border:1px solid #aab9ca;border-radius:8px}select{padding:8px}article{border:1px solid #dbe2eb;border-radius:8px;overflow:hidden;margin:10px 0}article h3{margin:0;padding:10px;color:white}article div{padding:10px}p{line-height:1.45}small{color:#52647a}header small{color:#e7b54b}.arrow{text-align:center;font-size:22px}progress{width:100%;accent-color:#25866a}.primary{background:#142f52;color:white}.muted{color:#64748b}@media(max-width:750px){main{grid-template-columns:1fr}}@media print{header,#controls,#actions{display:none}main{display:block}section{border:0}article{break-inside:avoid}}
.correct[aria-pressed=true]{background:#e5f5e9;color:#166534;border-color:#25866a}.incorrect{background:#fee2e2;color:#991b1b;border-color:#dc2626}.hint{color:#991b1b;font-size:14px;margin:6px 3px}</style><header><small>STDT · ACTION LEARNING</small><h1>Build Your Human-Centred Technology</h1>Team of six · Five minutes</header><main><section id="controls"><label>Team <select id="team"></select></label><h2>1. Select an issue</h2><div id="issues"></div><h2>2. Match the pools</h2><p>Choose one or two relevant elements from each pool. Green means correct; red means reconsider. Retry incorrect choices and discuss your reasoning.</p><progress id="progress" max="6" value="0"></progress><p id="status" aria-live="polite"></p><div id="pools"></div></section><section><h2>3. Your live framework</h2><p id="summary"></p><div id="framework"></div><div id="actions"><button class="primary" id="submit">Submit Framework</button><button id="copy">Copy framework</button><button id="print">Print / save PDF</button><button id="reset">Reset</button><p id="notice" role="status"></p></div></section></main><script>
const issues=['Difficulty accessing public transportation','Difficulty accessing hospital services'];
const pools=[['Human needs',['Accessibility','Safety','Convenience','Privacy','Clear information','Reduced waiting time']],['Factors',['Users','Infrastructure','Technology','Service providers','Information']],['Relationships',['User ↔ Technology','User ↔ Service provider','Technology ↔ Infrastructure','Information ↔ Decisions']],['Constraints',['Cost','Space','Time','Regulations','User capabilities']],['Design improvements',['Accessible controls','Simplified interface','Real-time information','Multilingual support','Human assistance']],['Evaluation criteria',['Ease of use','Accessibility','Reliability','Safety','User satisfaction']]];
const distractors=[["Brand prestige","Celebrity endorsement"],["Logo colour popularity","Celebrity endorsements"],["Logo ↔ Brand colour","Celebrity ↔ Advertising slogan"],["Seasonal fashion trends","Logo font preference"],["Additional advertising","Decorative animations only"],["Advertising revenue alone","Visual complexity alone"]];
const feedbackHints=['Focus on the needs of people accessing the service.','Consider elements that directly influence service access.','Choose interactions that affect the service experience.','Identify limitations that affect the proposed solution.','Choose improvements that address the access difficulty.','Evaluate human outcomes rather than unrelated commercial or decorative measures.'];
let rejected=pools.map(()=>[]);
const stages=[['Human Needs','#8056a8',[0]],['Systems Thinking','#3874ad',[1,2,3]],['Design Thinking','#25866a',[4]],['Human-Centred Technology','#142f52',[5]]];
let issue=0,selected=pools.map(()=>[]);const $=id=>document.getElementById(id);
for(let i=1;i<=3;i++)$('team').add(new Option('Team '+i,i));
function btn(label,active,fn,disabled=false){let b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',active);b.disabled=disabled;b.onclick=fn;return b}
function render(){ $('issues').replaceChildren(...issues.map((v,i)=>btn(v,i===issue,()=>{if(i!==issue){issue=i;selected=pools.map(()=>[]);rejected=pools.map(()=>[]);render()}})));$('pools').replaceChildren();pools.forEach(([name,opts],i)=>{let d=document.createElement('div'),h=document.createElement('h3');h.textContent=name+' ('+selected[i].length+'/2)';d.append(h);const choices=[...opts];choices.splice(1,0,distractors[i][0]);choices.splice(Math.max(3,choices.length-1),0,distractors[i][1]);choices.forEach(v=>{const wrong=distractors[i].includes(v),chosen=selected[i].includes(v),miss=rejected[i].includes(v);const b=btn(v,chosen,()=>{if(wrong){if(!miss)rejected[i].push(v)}else{selected[i]=chosen?selected[i].filter(x=>x!==v):[...selected[i],v]}render()},!wrong&&selected[i].length>=2&&!chosen);if(chosen){b.classList.add('correct');b.textContent='✓ '+v+' — Correct'}if(miss){b.classList.add('incorrect');b.textContent='✗ '+v+' — Incorrect'}d.append(b)});if(rejected[i].length){const hint=document.createElement('p');hint.className='hint';hint.setAttribute('role','status');hint.textContent=feedbackHints[i];d.append(hint)}$('pools').append(d)});let n=selected.filter(a=>a.length).length;updateSubmit();$('progress').value=n;$('status').textContent=n+' of 6 pools completed';$('summary').textContent='Team '+$('team').value+' · '+issues[issue];$('framework').replaceChildren();stages.forEach(([name,color,indices],k)=>{if(k){let a=document.createElement('div');a.className='arrow';a.textContent='↓';$('framework').append(a)}let a=document.createElement('article'),h=document.createElement('h3');h.style.background=color;h.textContent=name;a.append(h);indices.forEach(i=>{let d=document.createElement('div'),b=document.createElement('strong');b.textContent=pools[i][0];d.append(b,document.createElement('br'),document.createTextNode(selected[i].join(' · ')||'Awaiting selection…'));a.append(d)});$('framework').append(a)});}
const endpoint="https://script.google.com/macros/s/AKfycby3b_mJVVf9BxIng3IPDOuftvQIPXSBefo8G3VAE8W2pQQyO3yNHQ5t3v0Mmu8MsY7L/exec";let sending=false;function updateSubmit(){$('submit').disabled=sending||!selected.every(a=>a.length>0)};$('submit').onclick=async()=>{if($('submit').disabled)return;sending=true;updateSubmit();$('notice').textContent='Submitting…';try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({team:Number($('team').value),issue:issues[issue],pools:selected,concept:'Not required'})});const result=await response.json();if(!response.ok||!result.success)throw Error('Submission rejected');$('notice').textContent='Framework submitted successfully.'}catch(e){$('notice').textContent='Submission could not be confirmed. Please retry or ask your lecturer to check the results sheet.'}finally{sending=false;updateSubmit()}};$('team').onchange=render;$('reset').onclick=()=>{selected=pools.map(()=>[]);rejected=pools.map(()=>[]);render()};$('print').onclick=()=>window.print();$('copy').onclick=async()=>{let t=$('summary').textContent+'\n'+pools.map(([n],i)=>n+': '+selected[i].join(', ')).join('\n');try{await navigator.clipboard.writeText(t);$('notice').textContent='Framework copied.'}catch(e){$('notice').textContent='Copy unavailable. Use Print / save PDF.'}};render();
</script></html>
