<!doctype html><html><meta charset="utf-8"><style>body{font:16px system-ui;color:#142f52;background:#f3f5f8;margin:16px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}section{background:white;border:1px solid #ccd5df;border-radius:12px;padding:12px}article{border-radius:8px;padding:10px;margin:8px 0;color:white}h3,p{margin:4px 0}button,select{font:inherit;padding:8px}small{display:block} .arrow{text-align:center}@media(max-width:650px){main{grid-template-columns:1fr}}.issue{background:#fff1ce;color:#795500;border:1px solid #d6a638;border-radius:8px;padding:12px;margin:8px 0}</style><header><h2>HCT — Team Results</h2><select id="filter"><option value="all">All teams</option><option value="0">Team 1</option><option value="1">Team 2</option><option value="2">Team 3</option></select><button onclick="load()">Refresh</button><button onclick="window.print()">Print / PDF</button><span id="status"></span></header><div id="login"><label>Lecturer access key <input id="key" type="password" autocomplete="off"></label> <button onclick="unlock()">Unlock results</button></div><main id="cards"></main><script>let rows=[],accessKey='',busy=false;function unlock(){accessKey=document.getElementById('key').value.trim();load()}const el=(tag,t)=>{const e=document.createElement(tag);e.textContent=t;return e};function render(){const root=document.getElementById('cards');root.replaceChildren();rows.forEach((r,i)=>{if(filter.value!=='all'&&filter.value!==String(i))return;const s=el('section','');const issue=el('div','');issue.className='issue';issue.append(el('small','SELECTED ISSUE'),el('h3',r[1]||'Awaiting submission'));s.append(el('h2',r[0]),issue,el('small',r[8]||'Not submitted'));[['Human Needs','#8056a8',[[2,'Needs']]],['Systems Thinking','#3874ad',[[3,'Factors'],[4,'Relationships'],[5,'Constraints']]],['Design Thinking','#25866a',[[6,'Design improvements']]],['Human-Centred Technology','#142f52',[[7,'Evaluation criteria']]]].forEach(([title,color,fields],j)=>{if(j){const a=el('div','↓');a.className='arrow';s.append(a)}const a=el('article','');a.style.background=color;a.append(el('h3',title));fields.forEach(([k,n])=>{a.append(el('small',n),el('p',r[k]||'—'))});s.append(a)});root.append(s)})}function load(){if(!accessKey||busy)return;busy=true;google.script.run.withSuccessHandler(r=>{busy=false;document.getElementById('login').hidden=true;rows=r;render();status.textContent='Updated '+new Date().toLocaleTimeString()}).withFailureHandler(()=>{busy=false;accessKey='';rows=[];render();document.getElementById('login').hidden=false;status.textContent='Access denied or refresh failed. Enter your key again.'}).getResults(accessKey)}filter.onchange=render;setInterval(load,5000)</script></html>
